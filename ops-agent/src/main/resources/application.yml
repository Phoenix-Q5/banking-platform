server:
  port: 8085

spring:
  application:
    name: ops-agent
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

ops-agent:
  platform-name: ${PLATFORM_NAME:harbor-bank}
  security:
    # When true, incident workflow requires a Keycloak JWT (ADMIN/SUPPORT);
    # restart confirmation requires ADMIN.
    enabled: ${OPS_SECURITY_ENABLED:false}
    keycloak-token-url: ${OPS_KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/banking/protocol/openid-connect/token}
  persistence:
    # When true, incidents/restart requests persist to PostgreSQL
    # (configure the datasource via SPRING_DATASOURCE_* env vars).
    enabled: ${OPS_PERSISTENCE_ENABLED:false}
  auto-investigate: ${AUTO_INVESTIGATE:true}
  max-tool-rounds: ${MAX_TOOL_ROUNDS:6}
  mitigation-mode: ${MITIGATION_MODE:recommend} # recommend | auto
  observability:
    prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}
    loki-url: ${LOKI_URL:http://localhost:3100}
    tempo-url: ${TEMPO_URL:http://localhost:3200}
  services:
    api-gateway: ${API_GATEWAY_URL:http://localhost:8080}
    account-service: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    transaction-service: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
  notifications:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    service-alerts-enabled: ${SERVICE_ALERTS_ENABLED:true}
  llm:
    enabled: ${LLM_ENABLED:false}
    provider: ${LLM_PROVIDER:ollama}
    base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
    api-key: ${LLM_API_KEY:ollama}
    model: ${LLM_MODEL:llama3.2:3b}
    temperature: ${LLM_TEMPERATURE:0.2}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}

logging:
  level:
    root: INFO
    com.bankingplatform.opsagent: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
