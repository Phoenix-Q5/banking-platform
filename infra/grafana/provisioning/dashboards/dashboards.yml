apiVersion: 1

providers:
  - name: Harbor Bank
    orgId: 1
    folder: Harbor Bank
    folderUid: harbor-bank
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
