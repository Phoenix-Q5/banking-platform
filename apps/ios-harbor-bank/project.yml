name: HarborBank
options:
  bundleIdPrefix: com.harborbank
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: HarborBank/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.harborbank.mobile
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HarborBank:
    type: application
    platform: iOS
    sources:
      - path: HarborBank
    settings:
      base:
        PRODUCT_NAME: HarborBank
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HarborBank/Resources/Info.plist
      properties:
        CFBundleDisplayName: Harbor Bank
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
  HarborBankTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarborBankTests
    dependencies:
      - target: HarborBank
